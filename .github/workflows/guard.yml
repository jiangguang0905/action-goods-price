name: 日报兜底检查

on:
  schedule:
    - cron: "37 18 * * *"
      timezone: "Asia/Shanghai"
    - cron: "47 20 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 当日缺失则补跑
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?per_page=20" --jq "[.workflow_runs[] | select((.created_at | startswith(\"$day\")) and (.status != \"completed\" or .conclusion == \"success\"))] | length")
          if [ "$n" -eq 0 ]; then gh workflow run daily.yml --repo "${{ github.repository }}"; fi
